name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Works for any repo name: a project site (user.github.io/repo) gets /repo as its base path,
      # a user site (repo named user.github.io) gets none. A custom domain would need neither.
      - name: Work out the site address
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "SITE_URL=https://${OWNER}.github.io" >> "$GITHUB_ENV"
          if [ "${REPO,,}" = "${OWNER}.github.io" ]; then echo "BASE_PATH=/" >> "$GITHUB_ENV"; else echo "BASE_PATH=/${REPO}" >> "$GITHUB_ENV"; fi
      - uses: withastro/action@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
